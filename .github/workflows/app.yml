name: Application checks
# This repository's own application CI (Issue #10): typecheck, web build and tests, migrations and
# backend tests against a throwaway PostgreSQL. Model calls and pushes stay off; the backend tests opt
# themselves into collection restricted to this host (tests/setup.ts: OUTBOUND_LOOPBACK_ONLY), and paid
# providers stay locked. Deferred to M0.5 (Issue #13): the Docker smoke and the upstream "built site"
# smoke (starting API + web and running scripts/smoke.ts), which needs the M0.4 brand/module cleanup
# first so it checks the right pages. Not the upstream CI.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  # Superseded PR pushes are cancelled; every push to main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: insurhot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # tests/setup.ts refuses any database not named *_test or *_ci.
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/insurhot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
      # tests/setup.ts turns collection on for the test process, loopback-only; model calls stay off.
      COLLECT_ENABLED: "false"
      MODEL_CALLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Web tests
        run: node --test apps/web/tests/*.test.ts
      - name: Migrate and seed topics
        run: |
          node scripts/migrate.ts
          node scripts/seed.ts --topics-only
      - name: Backend tests (paid-lock-blocked files and cases excluded, see tests/paid-lock-blocked*.txt)
        run: bash scripts/test-unlocked.sh
      - name: Dependency audit (report only until M0.5 decides the threshold)
        continue-on-error: true
        run: npm audit --audit-level=high
